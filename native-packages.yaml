# Shared CLI: gem install native-packages --version 0.8.1
---
schema: 1
tool:
  version: 0.8.1
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the ALSA t64 package name. Override ELF
# inference as well as the explicit dependencies below.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: spotsie
  maintainer: Ahaan Shah <ahaanshah04@gmail.com>
  homepage: https://github.com/ahaan-shah/spotsie
  description: A native Spotify client
  license: MIT
  contents:
  # A glob source makes nFPM append its basename to the destination directory.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/spotsie"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/spotsie/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/spotsie/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/applications/*.desktop"
    dst: "/usr/share/applications/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/icons/*.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/"
    file_info:
      mode: 420
  - src: contrib/omarchy/spotsie.json.tpl
    dst: /usr/share/spotsie/omarchy/spotsie.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/spotsie-theme
    dst: /usr/share/spotsie/omarchy/spotsie-theme
    file_info:
      mode: 493
  overrides:
    # ELF inspection cannot discover the GUI's dlopen dependencies. Keep
    # these aligned with winit/glutin/rfd and packaging/check-runtime-libs.c.
    deb:
      depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libpulse0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pulseaudio-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'spotsie-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/spotsie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: spotsie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/spotsie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: spotsie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: ahaan-shah/spotsie
  prereleases: true
  checksums: checksums.txt
assets:
  AMD64:
    file: spotsie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/spotsie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: spotsie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/spotsie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: spotsie-v@VERSION@-source.tar.gz
    local: dist/spotsie-v@VERSION@-source.tar.gz
  MACOS:
    file: spotsie-v@VERSION@-macos-universal.dmg
    local: dist/spotsie-v@VERSION@-macos-universal.dmg
version_file: Cargo.toml
